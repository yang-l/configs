# Agent Deck Configuration
# All options: https://github.com/asheshgoplani/agent-deck/blob/main/skills/agent-deck/references/config-reference.md

[health]
  enabled = false

[hotkeys]
  scrollback = ""

[updates]
  check_enabled = false

[notifications]
  enabled = false

[docker]
  volume_ignores = [".gitconfig"]
  # ~/devel/code at its Mac path lets git follow worktree .git links.
  extra_volumes = { "/Users/yangliu/devel/code" = "/Users/yangliu/devel/code", "/Users/yangliu/.local/state/claude-handoffs-sandbox" = "/root/.local/state/claude-handoffs", "/Users/yangliu/.local/state/agent-deck-sandbox/codex-AGENTS.md" = "/root/.claude/codex/AGENTS.md" }

[feedback]
  disabled = true

[telemetry]
  disabled = true

[ui]
  preview_pct = 73

[claude]
  dangerous_mode = false

